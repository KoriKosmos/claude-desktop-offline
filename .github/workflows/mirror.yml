# Runs mirror.sh on GitHub's servers and commits the result, for when the
# machine you'd install on can't download from downloads.claude.ai. Start it
# from the Actions tab: Mirror > Run workflow.
name: Mirror

on:
  workflow_dispatch:
    inputs:
      arches:
        description: "Space-separated: x64 arm64"
        default: "x64"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download MSIX
        env:
          ARCHES: ${{ inputs.arches }}
        run: ./mirror.sh $ARCHES
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          if git diff --cached --quiet; then
            echo "Nothing new to mirror."
            exit 0
          fi
          git commit -m "Mirror Claude desktop $(cat releases/latest)"
          git push
